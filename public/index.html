<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InvoiceShift - Extractor de Facturas a CSV</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white border-b py-4 px-6 flex justify-between items-center shadow-sm">
    <h1 class="text-xl font-bold text-indigo-600">InvoiceShift <span class="text-xs bg-indigo-100 text-indigo-800 px-2 py-0.5 rounded">MVP</span></h1>
    <a href="#monetizacion" class="text-sm bg-indigo-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-indigo-700 transition">Obtener Pro</a>
  </header>

  <!-- Main Workspace -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
    
    <!-- Input Panel -->
    <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm flex flex-col">
      <h2 class="text-lg font-semibold mb-2">1. Pega el texto de la Factura</h2>
      <p class="text-xs text-gray-500 mb-4">Copia el contenido del PDF o e-mail de tu proveedor aquí.</p>
      
      <textarea id="invoiceInput" class="w-full flex-1 p-3 border rounded-lg text-sm font-mono focus:ring-2 focus:ring-indigo-500 focus:outline-none min-h-[220px]" placeholder="Ejemplo: Factura Nº: INV-2026-09
Fecha: 15/07/2026
Concepto: Servicios de desarrollo
Importe Total: 450.00 EUR"></textarea>
      
      <button onclick="processInvoice()" class="mt-4 w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-lg font-medium text-sm transition">
        Procesar Factura
      </button>
    </div>

    <!-- Output Panel -->
    <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm flex flex-col">
      <h2 class="text-lg font-semibold mb-2">2. Resultado Extraído</h2>
      <p class="text-xs text-gray-500 mb-4">Datos estructurados listos para exportar.</p>

      <div class="flex-1 bg-gray-50 p-4 rounded-lg border font-mono text-sm overflow-auto" id="outputJson">
        <span class="text-gray-400">// Esperando datos...</span>
      </div>

      <button onclick="downloadCSV()" id="btnDownload" disabled class="mt-4 w-full bg-emerald-600 hover:bg-emerald-700 disabled:bg-gray-300 text-white py-2.5 rounded-lg font-medium text-sm transition">
        Descargar CSV
      </button>
    </div>

  </main>

  <script>
    let currentParsedData = null;

    async function processInvoice() {
      const content = document.getElementById('invoiceInput').value;
      if (!content.trim()) return alert('Por favor, introduce texto.');

      const response = await fetch('/api/parse', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content })
      });

      const result = await response.json();

      if (result.success) {
        currentParsedData = result.data;
        document.getElementById('outputJson').textContent = JSON.stringify(result.data, null, 2);
        document.getElementById('btnDownload').disabled = false;
      } else {
        alert('Error: ' + result.error);
      }
    }

    function downloadCSV() {
      if (!currentParsedData) return;
      
      const headers = "Numero_Factura,Fecha,Importe,Procesado\n";
      const row = `"${currentParsedData.invoiceNumber}","${currentParsedData.date}",${currentParsedData.amount},"${currentParsedData.processedAt}"\n`;
      
      const blob = new Blob([headers + row], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `factura_${currentParsedData.invoiceNumber}.csv`;
      a.click();
    }
  </script>
</body>
</html>
